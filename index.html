<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camisa Naruto</title>
  <style>
    body {
      background-color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      width: 300px;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      overflow: hidden;
      background-color: #fff;
      text-align: center;
    }

    .card img {
      width: 100%;
      height: auto;
    }

    .card-content {
      padding: 20px;
    }

    .card h2 {
      margin: 0;
      color: #333;
    }

    .card p {
      color: #666;
      font-size: 14px;
      margin: 10px 0;
    }

    .price {
      color: #e67e22;
      font-size: 18px;
      font-weight: bold;
    }

    .button {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #f39c12;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    .button:hover {
      background-color: #e67e22;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="https://i.imgur.com/7Wj7s0b.jpg" alt="Camisa Naruto">
    <div class="card-content">
      <h2>Camisa Naruto</h2>
      <p>Demuestra tu pasión por el anime con esta increíble camisa de Naruto. Diseño exclusivo, calidad premium y estilo ninja.</p>
      <p class="price">€19.99</p>
      <a href="#" class="button">Comprar ahora</a>
    </div>
  </div>

</body>
</html>
